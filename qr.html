<!DOCTYPE html>
<html lang="en" data-i18n-title="card.qr.title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Generator</title>
  <meta name="description" content="Generate QR codes online — custom colors, size, logo. Download as PNG. Local browser tool.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬛</text></svg>">
  <script src="js/vendor/qrcode.min.js"></script>
  <style>
    .qr-preview { display: flex; align-items: center; justify-content: center; min-height: 280px; background: var(--color-bg); border-radius: var(--radius-lg); margin-bottom: 16px; }
    .qr-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .qr-row input, .qr-row select { padding: 10px 14px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; }
    .qr-row input[type="color"] { height: 44px; padding: 4px; cursor: pointer; }
  </style>

  <link rel="canonical" href="https://gameimageeditor.netlify.app/qr.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GameImage.tools">
  <meta property="og:url" content="https://gameimageeditor.netlify.app/qr.html">
  <meta property="og:title" content="QR Generator">
  <meta property="og:description" content="Generate QR codes online — custom colors, size, error correction level. Download as PNG. Local browser tool.">
  <meta property="og:image" content="https://gameimageeditor.netlify.app/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="QR Generator">
  <meta name="twitter:description" content="Generate QR codes online — custom colors, size, error correction level. Download as PNG. Local browser tool.">
  <meta name="twitter:image" content="https://gameimageeditor.netlify.app/og-image.png">
    </head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4M8 10v4"/><circle cx="15" cy="11" r="1"/><circle cx="18" cy="13" r="1"/></svg><span>GameImage.tools</span></a>
      <ul class="nav-links">
        <li><a href="qr.html">QR</a></li>
        <li><a href="heic.html">HEIC</a></li>
        <li><a href="wordcount.html">Word Count</a></li>
        <li><a href="password.html">Password</a></li>
        <li><button class="lang-toggle" onclick="i18n.setLang(i18n.getLang()==='zh'?'en':'zh')">中 / EN</button></li>
      </ul>
    </div>
  </nav>
  <main class="tool-page">
    <h1>QR Code Generator</h1>
    <p class="lead">Generate QR codes. Enter URL or text, customize colors and size, download as PNG.</p>
    <div class="editor-panel">
      <div class="control-group" style="margin-bottom:16px;">
        <label style="font-size:13px;font-weight:500;margin-bottom:6px;color:var(--color-text-secondary);">Content (URL or text)</label>
        <input type="text" id="qrText" placeholder="https://example.com" style="width:100%;padding:12px 14px;border:1px solid var(--color-border);border-radius:var(--radius-sm);font-size:15px;">
      </div>
      <div class="qr-row" style="margin-bottom:16px;">
        <div class="control-group"><label style="font-size:13px;font-weight:500;margin-bottom:6px;color:var(--color-text-secondary);">Size</label>
          <select id="qrSize"><option value="200">200 × 200</option><option value="300" selected>300 × 300</option><option value="400">400 × 400</option><option value="512">512 × 512</option></select>
        </div>
        <div class="control-group"><label style="font-size:13px;font-weight:500;margin-bottom:6px;color:var(--color-text-secondary);">Foreground</label>
          <input type="color" id="qrFg" value="#000000">
        </div>
      </div>
      <div class="qr-row" style="margin-bottom:16px;">
        <div class="control-group"><label style="font-size:13px;font-weight:500;margin-bottom:6px;color:var(--color-text-secondary);">Background</label>
          <input type="color" id="qrBg" value="#ffffff">
        </div>
        <div class="control-group"><label style="font-size:13px;font-weight:500;margin-bottom:6px;color:var(--color-text-secondary);">Error correction</label>
          <select id="qrEcc"><option value="L">L (7%)</option><option value="M" selected>M (15%)</option><option value="Q">Q (25%)</option><option value="H">H (30%)</option></select>
        </div>
      </div>
      <div class="qr-preview" id="qrPreview"></div>
      <div class="actions">
        <button class="btn btn-primary" id="genBtn">Generate</button>
        <button class="btn btn-secondary" id="downloadBtn">Download PNG</button>
      </div>
    </div>
  </main>
  <footer class="footer"><p><p>© 2026 GameImage.tools — Free Online Tools — All processing runs locally in your browser.</p></footer>
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script src="js/qr.js"></script>
</body>
</html>
