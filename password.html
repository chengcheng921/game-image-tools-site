<!DOCTYPE html>
<html lang="en" data-i18n-title="card.password.title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <meta name="description" content="Generate strong random passwords online. Custom length and character types. 100% local, no upload.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
  <style>
    .pw-display { width: 100%; padding: 20px; border: 2px dashed var(--color-border); border-radius: var(--radius-lg); font-family: 'SF Mono', monospace; font-size: 20px; text-align: center; background: var(--color-bg); margin-bottom: 16px; word-break: break-all; letter-spacing: 2px; }
    .pw-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .pw-option { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--color-bg); border-radius: var(--radius-md); font-size: 14px; }
    .pw-option input[type="checkbox"] { width: 18px; height: 18px; }
    .pw-strength { height: 8px; border-radius: 100px; background: var(--color-border); overflow: hidden; margin: 8px 0 16px; }
    .pw-strength-bar { height: 100%; width: 0; transition: width 0.3s; }
  </style>

  <link rel="canonical" href="https://gameimageeditor.netlify.app/password.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GameImage.tools">
  <meta property="og:url" content="https://gameimageeditor.netlify.app/password.html">
  <meta property="og:title" content="Password Generator">
  <meta property="og:description" content="Generate strong random passwords online. Custom length, uppercase/lowercase/numbers/symbols. 100% local.">
  <meta property="og:image" content="https://gameimageeditor.netlify.app/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Password Generator">
  <meta name="twitter:description" content="Generate strong random passwords online. Custom length, uppercase/lowercase/numbers/symbols. 100% local.">
  <meta name="twitter:image" content="https://gameimageeditor.netlify.app/og-image.png">
    </head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4M8 10v4"/><circle cx="15" cy="11" r="1"/><circle cx="18" cy="13" r="1"/></svg><span>GameImage.tools</span></a>
      <ul class="nav-links">
        <li><a href="qr.html">QR</a></li>
        <li><a href="heic.html">HEIC</a></li>
        <li><a href="wordcount.html">Word Count</a></li>
        <li><a href="password.html">Password</a></li>
        <li><button class="lang-toggle" onclick="i18n.setLang(i18n.getLang()==='zh'?'en':'zh')">中 / EN</button></li>
      </ul>
    </div>
  </nav>
  <main class="tool-page">
    <h1>Password Generator</h1>
    <p class="lead">Generate secure random passwords with custom length and character types.</p>
    <div class="editor-panel">
      <div class="pw-display" id="pwDisplay">Click Generate</div>
      <div class="pw-strength"><div class="pw-strength-bar" id="strengthBar"></div></div>
      <div class="control-group" style="margin-bottom:16px;">
        <label style="font-size:13px;font-weight:500;margin-bottom:6px;color:var(--color-text-secondary);">Length: <span id="lenVal" style="color:var(--color-blue);font-weight:600;">16</span></label>
        <input type="range" id="length" min="4" max="64" value="16" style="width:100%;">
      </div>
      <div class="pw-options">
        <label class="pw-option"><input type="checkbox" id="upper" checked> Uppercase (A-Z)</label>
        <label class="pw-option"><input type="checkbox" id="lower" checked> Lowercase (a-z)</label>
        <label class="pw-option"><input type="checkbox" id="number" checked> Numbers (0-9)</label>
        <label class="pw-option"><input type="checkbox" id="symbol" checked> Symbols (!@#$)</label>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="genBtn">Generate Password</button>
        <button class="btn btn-secondary" id="copyBtn">Copy</button>
      </div>
    </div>
  </main>
  <footer class="footer"><p><p>© 2026 GameImage.tools — Free Online Tools — Passwords are generated locally, never uploaded.</p></footer>
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script src="js/password.js"></script>
</body>
</html>
