    <p class="lead">Batch generate UUID v4 identifiers.</p>

      <div class="uuid-row">
        <label style="font-size:14px;">Count:</label>
        <input type="number" id="count" value="10" min="1" max="1000">
        <label style="font-size:14px;"><input type="checkbox" id="uppercase"> Uppercase</label>

        <button class="btn btn-secondary" id="copyBtn">Copy All</button>

      <textarea class="uuid-output" id="output" readonly></textarea>
