  <style>
    .color-preview { width: 100%; height: 120px; border-radius: var(--radius-md); margin-bottom: 16px; border: 1px solid var(--color-border-light); }
    .color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .color-row input { padding: 10px 14px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: 14px; font-family: 'SF Mono', monospace; background: var(--color-surface); color: var(--color-text); }
    .color-row input:focus { outline: none; border-color: var(--color-blue); }
    .color-row label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; display: block; }
    .color-field { display: flex; flex-direction: column; }
  </style>

  <main class="tool-page">
    <h1>Color Format Converter</h1>
    <p class="lead">Convert between HEX, RGB, and HSL color formats. Click any value to copy.</p>
    <div class="editor-panel">
      <div class="color-preview" id="preview" style="background:#0071e3"></div>
      <div class="color-field">
        <label>HEX</label>
        <input type="text" id="hex" value="#0071E3">
      </div>
      <div class="color-row" style="margin-top:12px;">
        <div class="color-field"><label>RGB</label><input type="text" id="rgb" value="rgb(0, 113, 227)" readonly onclick="copy(this)"></div>
        <div class="color-field"><label>HSL</label><input type="text" id="hsl" value="hsl(210, 100%, 45%)" readonly onclick="copy(this)"></div>
      </div>
      <div class="color-row">
        <div class="color-field"><label>R</label><input type="number" id="r" value="0" min="0" max="255"></div>
        <div class="color-field"><label>G</label><input type="number" id="g" value="113" min="0" max="255"></div>
        <div class="color-field"><label>B</label><input type="number" id="b" value="227" min="0" max="255"></div>
      </div>
      <div class="color-row">
        <div class="color-field"><label>H (0-360)</label><input type="number" id="h" value="210" min="0" max="360"></div>
        <div class="color-field"><label>S (0-100)</label><input type="number" id="s" value="100" min="0" max="100"></div>
        <div class="color-field"><label>L (0-100)</label><input type="number" id="l" value="45" min="0" max="100"></div>
      </div>
    </div>
  </main>
  <footer class="footer"><p><p>© 2026 GameImage.tools — Free Online Tools — All processing runs locally in your browser.</p></footer>
