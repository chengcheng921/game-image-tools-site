<!DOCTYPE html>
<html lang="en" data-i18n-title="card.json.title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter</title>
  <meta name="description" content="Format, minify, and validate JSON online with error location. Local browser tool, no upload.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>{}</text></svg>">
  <style>
    .code-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 768px) { .code-layout { grid-template-columns: 1fr; } }
    .code-box { display: flex; flex-direction: column; }
    .code-box textarea { width: 100%; min-height: 360px; padding: 16px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace; font-size: 13px; resize: vertical; background: var(--color-surface); color: var(--color-text); line-height: 1.5; }
    .code-box textarea:focus { outline: none; border-color: var(--color-blue); }
    .code-actions { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    .error-msg { color: var(--color-danger); font-size: 13px; margin-top: 8px; font-family: monospace; }
  </style>

  <link rel="canonical" href="https://gameimageeditor.netlify.app/json.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GameImage.tools">
  <meta property="og:url" content="https://gameimageeditor.netlify.app/json.html">
  <meta property="og:title" content="JSON Formatter">
  <meta property="og:description" content="Format, minify, validate JSON online with precise error location. Works in your browser — data never leaves your device.">
  <meta property="og:image" content="https://gameimageeditor.netlify.app/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="JSON Formatter">
  <meta name="twitter:description" content="Format, minify, validate JSON online with precise error location. Works in your browser — data never leaves your device.">
  <meta name="twitter:image" content="https://gameimageeditor.netlify.app/og-image.png">
    </head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="12" rx="2"/>
          <path d="M6 12h4M8 10v4"/>
          <circle cx="15" cy="11" r="1"/>
          <circle cx="18" cy="13" r="1"/>
        </svg>
        <span data-i18n="site.name">GameImage.tools</span>
      </a>
      <ul class="nav-links">
        <li><a href="json.html" data-i18n="card.json.title">JSON</a></li>
        <li><a href="base64.html">Base64</a></li>
        <li><a href="url.html">URL</a></li>
        <li><a href="timestamp.html">Timestamp</a></li>
        <li><button class="lang-toggle" onclick="i18n.setLang(i18n.getLang()==='zh'?'en':'zh')">中 / EN</button></li>
      </ul>
    </div>
  </nav>

  <main class="tool-page">
    <h1 data-i18n="card.json.title">JSON Formatter</h1>
    <p class="lead" data-i18n="card.json.desc">Format, minify and validate JSON data with error highlighting.</p>

    <div class="editor-panel">
      <div class="code-actions">
        <button class="btn btn-primary" id="formatBtn" data-i18n="code.format">Format</button>
        <button class="btn btn-secondary" id="minifyBtn" data-i18n="code.minify">Minify</button>
        <button class="btn btn-secondary" id="copyBtn" data-i18n="code.copy">Copy</button>
        <button class="btn btn-secondary" id="clearBtn" data-i18n="code.clear">Clear</button>
      </div>

      <div class="code-layout">
        <div class="code-box">
          <label style="font-size:13px;font-weight:500;margin-bottom:6px;color:var(--color-text-secondary);" data-i18n="code.input">Input</label>
          <textarea id="input" placeholder='{"name":"game","score":100}'></textarea>
        </div>
        <div class="code-box">
          <label style="font-size:13px;font-weight:500;margin-bottom:6px;color:var(--color-text-secondary);" data-i18n="code.output">Output</label>
          <textarea id="output" readonly placeholder="Result will appear here..."></textarea>
        </div>
      </div>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </main>

  <footer class="footer">
    <p><span data-i18n="footer.copy">© 2026 GameImage.tools — Free online image tools for gamers</span><br>
    <span data-i18n="footer.privacy">All processing is done locally in your browser. No images are uploaded to any server.</span></p>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script src="js/json.js"></script>
</body>
</html>
