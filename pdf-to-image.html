<!DOCTYPE html>
<html lang="en" data-i18n-title="card.pdf2img.title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to Image</title>
  <meta name="description" content="Convert PDF pages to PNG or JPG images online. Batch export. 100% local browser processing.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼️</text></svg>">
  <script src="js/vendor/pdf.min.js"></script>
  <script src="js/vendor/jszip.min.js"></script>
  <script>if (window['pdfjsLib']) pdfjsLib.GlobalWorkerOptions.workerSrc = 'js/vendor/pdf.worker.min.js';</script>
  <style>
    .pdf-img-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-top: 16px; }
    .pdf-img-item { background: var(--color-bg); border-radius: var(--radius-md); padding: 12px; text-align: center; }
    .pdf-img-item img { max-width: 100%; max-height: 200px; object-fit: contain; border-radius: 8px; margin-bottom: 8px; }
  </style>

  <link rel="canonical" href="https://gameimageeditor.netlify.app/pdf-to-image.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GameImage.tools">
  <meta property="og:url" content="https://gameimageeditor.netlify.app/pdf-to-image.html">
  <meta property="og:title" content="PDF to Image">
  <meta property="og:description" content="Convert each page of a PDF to PNG or JPG images online. Batch export, local browser processing.">
  <meta property="og:image" content="https://gameimageeditor.netlify.app/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PDF to Image">
  <meta name="twitter:description" content="Convert each page of a PDF to PNG or JPG images online. Batch export, local browser processing.">
  <meta name="twitter:image" content="https://gameimageeditor.netlify.app/og-image.png">
    </head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4M8 10v4"/><circle cx="15" cy="11" r="1"/><circle cx="18" cy="13" r="1"/></svg><span>GameImage.tools</span></a>
      <ul class="nav-links">
        <li><a href="pdf-merge.html">PDF Merge</a></li>
        <li><a href="pdf-split.html">PDF Split</a></li>
        <li><a href="pdf-to-image.html">PDF → Image</a></li>
        <li><a href="epub.html">EPUB</a></li>
        <li><button class="lang-toggle" onclick="i18n.setLang(i18n.getLang()==='zh'?'en':'zh')">中 / EN</button></li>
      </ul>
    </div>
  </nav>
  <main class="tool-page">
    <h1>PDF to Image</h1>
    <p class="lead">Export each PDF page as PNG or JPG images.</p>
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="application/pdf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <p><strong>Drop a PDF file here</strong> or click to select</p>
      <p class="hint">Supports .pdf</p>
    </div>
    <div class="editor-panel" id="editorPanel" style="display:none;">
      <div class="controls" style="margin-bottom:16px;">
        <div class="control-group">
          <label style="font-size:13px;font-weight:500;margin-bottom:6px;color:var(--color-text-secondary);">Output format</label>
          <select id="outFormat"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option></select>
        </div>
      </div>
      <div class="actions" style="margin-bottom:16px;">
        <button class="btn btn-primary" id="convertBtn">Convert</button>
        <button class="btn btn-secondary" id="downloadAllBtn">Download All</button>
        <button class="btn btn-secondary" id="resetBtn">New File</button>
      </div>
      <div class="pdf-img-list" id="imgList"></div>
    </div>
  </main>
  <footer class="footer"><p><p>© 2026 GameImage.tools — Free Online Tools — All processing runs locally in your browser.</p></footer>
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pdf-to-image.js"></script>
</body>
</html>
